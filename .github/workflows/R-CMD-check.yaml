# R CMD check on Ubuntu. Actions are pinned to release tags, and CRAN packages
# come from a dated Posit Package Manager snapshot, so a run is reproducible.
# To move forward, bump the tags and the snapshot date together.
name: R-CMD-check

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      CRAN_SNAPSHOT: https://packagemanager.posit.co/cran/__linux__/noble/2026-10-15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: r-lib/actions/setup-r@v2.14.0
        with:
          r-version: '4.5'
          use-public-rspm: false

      - name: Use the dated CRAN snapshot
        run: echo "options(repos = c(CRAN = '${CRAN_SNAPSHOT}'))" >> ~/.Rprofile

      - uses: r-lib/actions/setup-r-dependencies@v2.14.0
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2.14.0
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
